services:
  postgres:
    image: postgres:16-alpine
    container_name: appsec_postgres
    environment:
      POSTGRES_USER: appsec_user
      POSTGRES_PASSWORD: appsec_password
      POSTGRES_DB: appsec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec_user -d appsec_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appsec-net

  redis:
    image: redis:7-alpine
    container_name: appsec_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appsec-net

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: appsec_auth
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=Auth Service
      - PORT=8001
      - DATABASE_URL=postgresql+asyncpg://appsec_user:appsec_password@postgres:5432/appsec_db
      - JWT_SECRET_KEY=appsec-super-secret-key-change-in-production-2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - appsec-net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: appsec_api
    ports:
      - "8002:8002"
    environment:
      - APP_NAME=Core Resource API Service
      - PORT=8002
      - DATABASE_URL=postgresql+asyncpg://appsec_user:appsec_password@postgres:5432/appsec_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=appsec-super-secret-key-change-in-production-2026
      - JWT_ALGORITHM=HS256
      - CACHE_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - appsec-net

volumes:
  postgres_data:
  redis_data:

networks:
  appsec-net:
    driver: bridge
